<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEP Hub — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .login-card{background:var(--paper-raised);border-radius:20px;box-shadow:0 8px 24px -8px rgba(5,28,44,.14);width:100%;max-width:420px;border:1px solid var(--line);overflow:hidden;}
  .brand-mark{display:flex;align-items:center;padding:28px 36px;background:var(--navy);}
  .brand-mark img{width:150px;height:auto;display:block;}
  .login-fields{padding:30px 36px 36px;}
  .field-group{margin-bottom:18px;}
  label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px;color:var(--navy);}
  input[type=text],input[type=password]{width:100%;padding:13px 15px;font-size:15.5px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--navy);font-family:'Source Sans 3',sans-serif;transition:border-color .15s ease;}
  input[type=text]:focus,input[type=password]:focus{outline:none;border-color:var(--blue);background:#fff;}
  .pw-row{position:relative;}
  .pw-toggle{position:absolute;right:12px;top:39px;background:none;border:none;font-size:12.5px;font-weight:600;color:var(--blue);cursor:pointer;padding:6px 4px;font-family:'Source Sans 3',sans-serif;}
  .login-btn{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:15.5px;font-weight:600;cursor:pointer;margin-top:6px;font-family:'Source Sans 3',sans-serif;transition:background .15s ease;}
  .login-btn:hover{background:var(--blue-hover);}
  .login-meta{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px;}
  .login-meta a{color:var(--blue);font-weight:600;}
  .remember{display:flex;align-items:center;gap:7px;color:var(--stone);}
  .error-msg{background:#FBEAE5;color:#B3543F;border:1px solid #EFC9BC;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:16px;display:none;}
  .error-msg.show{display:block;}
  .demo-hint{margin-top:24px;padding:14px 16px;background:var(--blue-tint);border-radius:10px;font-size:13px;color:var(--navy);line-height:1.5;}
  .demo-hint strong{font-weight:700;}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-mark">
    <img src="assets/hep-logo-dark.png" alt="Hobart Exercise Physiology">
  </div>

  <div class="login-fields">
    <div class="error-msg" id="error-msg">That email or password doesn't match. Please try again.</div>

    <div class="field-group">
      <label for="email">Email</label>
      <input type="text" id="email" placeholder="john.smith@email.com" autocomplete="username">
    </div>

    <div class="field-group pw-row">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button>
    </div>

    <button class="login-btn" id="login-btn">Log in</button>

    <div class="login-meta">
      <label class="remember"><input type="checkbox" checked> Keep me logged in</label>
      <a href="#">Forgot password?</a>
    </div>

    <div class="demo-hint">
      <strong>Demo login</strong> — this is a mockup so the details below are pre-filled for you:<br>
      Email: <strong>john.smith@email.com</strong><br>
      Password: <strong>JohnSmith1!</strong>
    </div>
  </div>
</div>

<script>
  const emailInput = document.getElementById('email');
  const pwInput = document.getElementById('password');
  const loginBtn = document.getElementById('login-btn');
  const errorMsg = document.getElementById('error-msg');
  const pwToggle = document.getElementById('pw-toggle');

  const VALID_EMAIL = 'john.smith@email.com';
  const VALID_PW = 'JohnSmith1!';

  pwToggle.addEventListener('click', () => {
    const showing = pwInput.type === 'text';
    pwInput.type = showing ? 'password' : 'text';
    pwToggle.textContent = showing ? 'Show' : 'Hide';
  });

  function attemptLogin(){
    const emailVal = emailInput.value.trim().toLowerCase();
    const pwVal = pwInput.value;
    if((emailVal === VALID_EMAIL.toLowerCase() && pwVal === VALID_PW) || (emailVal === '' && pwVal === '')){
      errorMsg.classList.remove('show');
      window.location.href = 'welcome.html';
    } else {
      errorMsg.classList.add('show');
    }
  }

  loginBtn.addEventListener('click', attemptLogin);
  pwInput.addEventListener('keydown', e => { if(e.key === 'Enter') attemptLogin(); });
</script>

</body>
</html>
