<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect — Hobart HEP Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  :root{--accent:var(--slate);--accent-soft:var(--slate-soft);}
  .page-head{padding:44px 40px 8px;}
  .back{font-family:'IBM Plex Mono';font-size:11px;color:var(--stone);text-decoration:none;letter-spacing:.06em;}
  .page-head h1{font-size:32px;font-weight:600;margin:14px 0 8px;}
  .page-head p{color:var(--stone);font-size:14.5px;max-width:560px;line-height:1.6;}
  .ig-note{display:flex;align-items:center;justify-content:space-between;padding:24px 40px 4px;}
  .ig-link{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);}
  .ig-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:20px 40px 70px;}
  .ig-tile{aspect-ratio:1;border-radius:10px;background:linear-gradient(160deg,var(--accent-soft),var(--accent));}
  @media(max-width:820px){.ig-grid{grid-template-columns:repeat(3,1fr);padding:20px;}.page-head,.ig-note{padding-left:20px;padding-right:20px;}}
</style>
</head>
<body>
<nav>
  <a class="brand" href="index.html"><img src="logo.png" alt="Hobart Exercise Physiology"><div class="brand-sub">Member Hub</div></a>
  <div class="nav-right"><span>Home</span><span>Support</span><div class="avatar">C</div></div>
</nav>
<div class="page-head">
  <a class="back" href="index.html">← BACK TO HUB</a>
  <h1>Connect</h1>
  <p>Live from our Instagram — the latest posts from the HEP community, right here in the hub.</p>
</div>
<div class="ig-note">
  <span class="mono-label" style="color:var(--stone);">Live feed</span>
  <a class="ig-link" href="#">Visit @hobartexercisephysiology →</a>
</div>
<div class="ig-grid">
  <div class="ig-tile"></div><div class="ig-tile"></div><div class="ig-tile"></div><div class="ig-tile"></div><div class="ig-tile"></div>
  <div class="ig-tile"></div><div class="ig-tile"></div><div class="ig-tile"></div><div class="ig-tile"></div><div class="ig-tile"></div>
</div>
<footer><span>Hobart Exercise Physiology — South Hobart &amp; Lindisfarne</span><span>hobart hep hub</span></footer>
</body>
</html>
